<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Random Number</title>
  <style>
    :root {
      color-scheme: dark;
    }
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2rem;
      background: #121212;
      color: #f5f5f5;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      padding: 1.5rem;
      text-align: center;
    }
    h1 {
      margin: 0;
      font-size: clamp(1.2rem, 4vw, 1.75rem);
      font-weight: 500;
      letter-spacing: 0.02em;
      color: #b3b3b3;
    }
    .display {
      font-size: clamp(4rem, 22vw, 9rem);
      font-weight: 700;
      line-height: 1;
      min-height: 1em;
      font-variant-numeric: tabular-nums;
      background: linear-gradient(135deg, #6ee7ff, #a78bfa);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      transition: transform 0.15s ease;
    }
    .display.pop {
      transform: scale(1.08);
    }
    button {
      width: min(100%, 22rem);
      padding: 1.25rem 2rem;
      font-size: clamp(1.1rem, 3.5vw, 1.4rem);
      font-weight: 600;
      color: #0b0b0b;
      background: linear-gradient(135deg, #6ee7ff, #a78bfa);
      border: none;
      border-radius: 999px;
      cursor: pointer;
      transition: transform 0.1s ease, box-shadow 0.2s ease, filter 0.2s ease;
      box-shadow: 0 8px 24px rgba(110, 231, 255, 0.25);
    }
    button:hover {
      filter: brightness(1.1);
      box-shadow: 0 10px 30px rgba(167, 139, 250, 0.35);
    }
    button:active {
      transform: scale(0.97);
    }
    button:focus-visible {
      outline: 3px solid #a78bfa;
      outline-offset: 3px;
    }
  </style>
</head>
<body>
  <h1>Pick a number, 1 to 100</h1>
  <div class="display" id="display" aria-live="polite">?</div>
  <button id="roll" type="button">Roll</button>

  <script>
    (function () {
      var display = document.getElementById("display");
      var button = document.getElementById("roll");

      button.addEventListener("click", function () {
        var value = Math.floor(Math.random() * 100) + 1;
        display.textContent = value;
        display.classList.add("pop");
        setTimeout(function () {
          display.classList.remove("pop");
        }, 150);
      });
    })();
  </script>
</body>
</html>
