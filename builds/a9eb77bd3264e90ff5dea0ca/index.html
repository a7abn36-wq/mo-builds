<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Tiny To-Do</title>
<style>
  :root {
    --bg: #0d1017;
    --card: #171b24;
    --field: #10141c;
    --ink: #e9ecf5;
    --muted: #9098ac;
    --line: #2a303d;
    --accent: #7c8cff;
    --accent-hover: #6a7bf2;
    --accent-soft: rgba(124, 140, 255, 0.2);
    --danger: #ff6b78;
    --danger-soft: rgba(255, 107, 120, 0.14);
    --check-border: #4b5366;
    --shadow: 0 14px 40px rgba(0, 0, 0, 0.45);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: radial-gradient(circle at 50% 0%, #151a26, var(--bg) 60%);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    display: flex;
    justify-content: center;
    padding: clamp(24px, 6vw, 72px) 16px;
  }
  .app {
    width: 100%;
    max-width: 520px;
  }
  header {
    margin-bottom: 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
  }
  h1 {
    font-size: clamp(28px, 6vw, 38px);
    letter-spacing: -0.03em;
    margin: 0 0 6px;
    font-weight: 700;
  }
  .subtitle { margin: 0; color: var(--muted); font-size: 15px; }
  .remaining {
    flex: none;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-width: 72px;
    padding: 10px 12px;
    border: 1px solid var(--line);
    border-radius: 14px;
    background: var(--card);
    box-shadow: var(--shadow);
  }
  .remaining-num {
    font-size: 26px;
    font-weight: 700;
    line-height: 1.1;
    color: var(--accent);
    font-variant-numeric: tabular-nums;
  }
  .remaining-label {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--muted);
    margin-top: 2px;
  }
  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 18px;
    box-shadow: var(--shadow);
    overflow: hidden;
  }
  .entry {
    display: flex;
    gap: 10px;
    padding: 14px;
    border-bottom: 1px solid var(--line);
  }
  input[type="text"] {
    flex: 1;
    min-width: 0;
    border: 1px solid var(--line);
    background: var(--field);
    border-radius: 10px;
    padding: 12px 14px;
    font: inherit;
    font-size: 15px;
    color: var(--ink);
    outline: none;
    transition: border-color 0.15s, box-shadow 0.15s;
  }
  input[type="text"]:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-soft);
  }
  input[type="text"]::placeholder { color: var(--muted); }
  button {
    font: inherit;
    cursor: pointer;
    border: 0;
    border-radius: 10px;
    transition: background 0.15s, color 0.15s, transform 0.1s;
  }
  button:active { transform: scale(0.96); }
  .add {
    background: var(--accent);
    color: #0d1017;
    padding: 0 20px;
    font-weight: 700;
    font-size: 15px;
  }
  .add:hover { background: var(--accent-hover); }
  ul { list-style: none; margin: 0; padding: 6px; }
  li {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 12px;
    border-radius: 10px;
  }
  li + li { margin-top: 2px; }
  li:hover { background: var(--field); }
  .check {
    appearance: none;
    flex: none;
    width: 22px;
    height: 22px;
    border: 2px solid var(--check-border);
    border-radius: 7px;
    cursor: pointer;
    position: relative;
    transition: background 0.15s, border-color 0.15s;
  }
  .check:hover { border-color: var(--accent); }
  .check:checked {
    background: var(--accent);
    border-color: var(--accent);
  }
  .check:checked::after {
    content: "";
    position: absolute;
    left: 6px;
    top: 2px;
    width: 5px;
    height: 10px;
    border: solid #0d1017;
    border-width: 0 2px 2px 0;
    transform: rotate(45deg);
  }
  .label {
    flex: 1;
    min-width: 0;
    font-size: 15px;
    line-height: 1.4;
    overflow-wrap: anywhere;
    cursor: pointer;
  }
  li.done .label { color: var(--muted); text-decoration: line-through; }
  .delete {
    flex: none;
    background: transparent;
    color: var(--muted);
    width: 30px;
    height: 30px;
    font-size: 20px;
    line-height: 1;
    border-radius: 8px;
  }
  .delete:hover { background: var(--danger-soft); color: var(--danger); }
  .empty {
    padding: 40px 20px;
    text-align: center;
    color: var(--muted);
    font-size: 15px;
  }
  footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 12px 18px;
    border-top: 1px solid var(--line);
    color: var(--muted);
    font-size: 13px;
  }
  .clear {
    background: transparent;
    color: var(--muted);
    padding: 6px 8px;
    font-size: 13px;
  }
  .clear:hover { color: var(--danger); }
  @media (max-width: 420px) {
    .entry { flex-wrap: wrap; }
    .add { width: 100%; padding: 12px; }
    .remaining { min-width: 64px; }
  }
</style>
</head>
<body>
<main class="app">
  <header>
    <div>
      <h1>To-Do</h1>
      <p class="subtitle">A little list for the things on your mind.</p>
    </div>
    <div class="remaining" role="status" aria-live="polite" aria-label="Remaining tasks">
      <span class="remaining-num" id="remaining-num">0</span>
      <span class="remaining-label">left</span>
    </div>
  </header>
  <section class="card">
    <form class="entry" id="form">
      <input id="input" type="text" placeholder="Add a task..." maxlength="200" autocomplete="off" aria-label="New task">
      <button class="add" type="submit">Add</button>
    </form>
    <ul id="list"></ul>
    <footer>
      <span id="count" aria-live="polite">0 tasks left</span>
      <button class="clear" id="clear" type="button">Clear completed</button>
    </footer>
  </section>
</main>
<script>
  var form = document.getElementById('form');
  var input = document.getElementById('input');
  var list = document.getElementById('list');
  var count = document.getElementById('count');
  var remainingNum = document.getElementById('remaining-num');
  var clear = document.getElementById('clear');
  var tasks = [];

  function render() {
    list.innerHTML = '';
    if (tasks.length === 0) {
      var empty = document.createElement('li');
      empty.className = 'empty';
      empty.textContent = 'Nothing here yet. Add your first task above.';
      list.appendChild(empty);
    }
    tasks.forEach(function(task, index) {
      var li = document.createElement('li');
      if (task.done) li.className = 'done';

      var check = document.createElement('input');
      check.type = 'checkbox';
      check.className = 'check';
      check.checked = task.done;
      check.setAttribute('aria-label', 'Toggle ' + task.text);
      check.addEventListener('change', function() {
        tasks[index].done = check.checked;
        render();
      });

      var label = document.createElement('label');
      label.className = 'label';
      label.textContent = task.text;

      var remove = document.createElement('button');
      remove.type = 'button';
      remove.className = 'delete';
      remove.textContent = '\u00d7';
      remove.setAttribute('aria-label', 'Delete ' + task.text);
      remove.addEventListener('click', function() {
        tasks.splice(index, 1);
        render();
      });

      li.appendChild(check);
      li.appendChild(label);
      li.appendChild(remove);
      list.appendChild(li);
    });

    var left = tasks.filter(function(task) { return !task.done; }).length;
    count.textContent = left + (left === 1 ? ' task left' : ' tasks left');
    remainingNum.textContent = left;
    clear.disabled = tasks.every(function(task) { return !task.done; });
    clear.style.opacity = clear.disabled ? '0.4' : '1';
  }

  form.addEventListener('submit', function(event) {
    event.preventDefault();
    var text = input.value.trim();
    if (!text) return;
    tasks.push({ text: text, done: false });
    input.value = '';
    render();
    input.focus();
  });

  clear.addEventListener('click', function() {
    tasks = tasks.filter(function(task) { return !task.done; });
    render();
  });

  render();
</script>
</body>
</html>
